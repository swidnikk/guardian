# Builds the Methodology Library Explorer and deploys it to GitHub Pages.
# Requires: Settings > Pages > Source = "GitHub Actions".
name: Library Explorer (Pages)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to read Methodology Library from (blank = the branch the run is started on)'
        required: false
        default: 'swid/policy-manifest-backfill'
  push:
    branches: [main]            # ASSUMED default branch; change if yours differs
    paths:
      - 'Methodology Library/**'
      - 'tools/library-explorer/**'
      - '.github/workflows/library-explorer-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7            # the explorer tooling, from the branch this run started on
      - uses: actions/checkout@v7            # the library to publish, from the 'ref' input (push runs: same branch)
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: _lib
          sparse-checkout: Methodology Library
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/library-explorer/package-lock.json
      - name: Install
        working-directory: tools/library-explorer
        run: npm ci
      - name: Build site (reads the library, writes only _site)
        working-directory: tools/library-explorer
        run: node build.js --lib "$GITHUB_WORKSPACE/_lib/Methodology Library" --out "$GITHUB_WORKSPACE/_site" --label "Methodology Library"
      - name: Drop the build report (not part of the site)
        run: rm -f _site/build-report.json && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
