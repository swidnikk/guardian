# Guardian Policy Manifest — Gold Standard MECD v2.0 (Paris Agreement Aligned)
# Schema: https://guardian.hedera.com/schemas/policy-manifest/v1.0.0/policy.schema.json
# Spec:   ../../../../MANIFEST_SPEC.md

# ── Identity ────────────────────────────────────────────────────────────────

# Globally unique kebab-case slug. Never change after first publish.
id: gold-standard-mecd-v2

# Human-readable display name shown in the catalog.
name: "Gold Standard MECD v2.0 — Metered & Measured Energy Cooking Devices (Paris Agreement Aligned)"

# Semver of this Guardian implementation.
version: "2.0.0"

# 1–3 sentence plain-English summary.
description: >
  Implements Gold Standard's Metered & Measured Energy Cooking Devices
  methodology, version 2.0 — the Paris-Agreement-aligned (PAA) revision
  approved in 2025. The policy covers clean cookstove projects that deploy
  metered stoves with device-level monitoring (CTEC), walks the project
  end-to-end from listing through VVB verification, and mints a Verified
  Emission Reduction (VER) token for each tCO₂e credited. v2.0 supersedes
  the MECD v1.2 implementation.

# ── Classification ───────────────────────────────────────────────────────────

# standard-implementation: faithfully implements a published standard methodology.
policy_type: standard-implementation

# Implementation lifecycle state.
status: active

license: Apache-2.0

# carbon-offsets | emission-reporting | supply-chain | biodiversity | payments | other
category: carbon-offsets

# ── Upstream methodology ─────────────────────────────────────────────────────

standard_body: Gold Standard

# Upstream methodology identifier as used by Gold Standard.
methodology_id: MECD

# Upstream version — verbatim as published by Gold Standard Foundation.
methodology_version: "2.0"

# ── Token ────────────────────────────────────────────────────────────────────

# Token symbol minted by this policy (one VER per tCO₂e).
token_type: VER

# Hedera token standard: fungible | HIP-412-NFT | none
token_standard: fungible

# ── Registry ─────────────────────────────────────────────────────────────────

# Status with external registry. none | pending | validated | revoked
registry_status: validated

registry_body: Gold Standard Foundation

