    type: organization
tags:
  - mrv-template
  - mrv
  - agriculture
  - soil-carbon
standard_body: Dovu
token_type: SoilCarbonCoalition
token_standard: fungible
roles:
  - Registrant
  - Verifier
maintainers:
  - name: DOVU
sector: agriculture
