id: ghg-korean-waste-disposal
name: Korean Waste Disposal
version: "1.0.0"
description: >
  Calculates Scope 1 greenhouse gas emissions from waste treatment in Korea,
  covering incineration, landfilling and biological treatment, following the
  national guidelines of the Greenhouse Gas Inventory and Research Center of
  Korea (GIR).
