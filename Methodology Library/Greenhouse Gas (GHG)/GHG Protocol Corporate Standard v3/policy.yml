id: ghg-protocol-corporate-standard-v3
name: GHG Protocol Corporate Standard v3
version: "1.0.0"
description: >
  Guardian implementation of the GHG Protocol Corporate Accounting and Reporting
  Standard (including the Scope 2 Guidance). A main framework of schemas plus
  selectable calculation, activity-data and secondary-data tools produces
  organizational Scope 1, 2 and 3 inventories, minting Carbon Emission Tokens
  after assurance.
