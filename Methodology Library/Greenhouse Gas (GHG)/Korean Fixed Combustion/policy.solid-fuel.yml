id: ghg-korean-fixed-combustion-solid-fuel
name: Korean Fixed Combustion (Solid Fuel)
version: "0.1.5"
description: >
  Calculates Scope 1 direct greenhouse gas emissions from the combustion of
  solid fuels (domestic and imported anthracite, bituminous coal and
  sub-bituminous coal) in stationary equipment, using Korean national
  calorific values and emission factors. Supports cost-based and usage-based
  activity data.
policy_type: standard-implementation
status: draft
license: Apache-2.0
category: emission-reporting
authors:
  - name: Wincl
    type: organization
tags:
  - ghg-protocol
  - asia
standard_body: GHG Protocol
maintainers:
  - name: Wincl
sector: industrial
