# Guardian Policy Manifest — Verra VM0007 REDD+ Methodology Framework
# Schema: https://guardian.hedera.com/schemas/policy-manifest/v1.0.0/policy.schema.json
# Spec:   ../../../MANIFEST_SPEC.md

# ── Identity ────────────────────────────────────────────────────────────────

# Globally unique kebab-case slug. Never change this after first publish.
id: verra-vm0007-redd-plus

# Human-readable display name shown in the catalog.
name: "Verra VM0007 REDD+ Methodology Framework"

# Semver of this Guardian implementation (not the upstream methodology version).
# See MANIFEST_SPEC.md §Versioning for the distinction.
version: "3.0.0"

# 1–3 sentence plain-English summary.
description: >
  Implements Verra's VM0007 REDD+ Methodology Framework (v7.0) for the
  Avoiding Planned Deforestation (ADP) project type on the Hedera ledger.
  The policy walks a VCS project end-to-end — from project description
  submission through VVB validation, monitoring, and verification — and
  mints a Verified Carbon Unit (VCU) token for each tCO₂e credited.
  Version 3.0 introduces private group-based multi-signature VVB approval.

# ── Classification ───────────────────────────────────────────────────────────

# policy_type — relationship to upstream standards.
# standard-implementation: faithfully implements a published standard methodology.
# Other values: novel-methodology | mrv-template | proof-of-concept | toolkit
policy_type: standard-implementation

# Implementation lifecycle state.
# draft | candidate | active | deprecated | superseded
status: active

# SPDX license identifier.
license: Apache-2.0

# Primary domain of this policy.
# carbon-offsets | emission-reporting | supply-chain | biodiversity | payments | other
category: carbon-offsets

# ── Upstream methodology ─────────────────────────────────────────────────────

# Standards organization that owns the upstream methodology.
standard_body: Verra

# Upstream methodology identifier as used by the standard body.
methodology_id: VM0007

# Upstream methodology version — verbatim as published by Verra.
# This is NOT a semver; it mirrors the standard body's versioning.
methodology_version: "7.0"

# ── Token ────────────────────────────────────────────────────────────────────

# Symbol of the token minted by this policy.
token_type: VCU

# Hedera token standard: fungible | HIP-412-NFT | none
token_standard: fungible

# ── Registry ─────────────────────────────────────────────────────────────────

# Status with external registry. none | pending | validated | revoked
registry_status: validated

# Registry body that formally validated this implementation.
registry_body: Verra

# ── Authorship ───────────────────────────────────────────────────────────────

# Primary authors responsible for the Guardian implementation.
# name is required; url, type, github are optional.
authors:
  - name: Envision Blockchain
    url: https://envisionblockchain.com
    type: organization
    github: EnvisionBlockchain

maintainers:
  - name: Hashgraph Association
    url: https://hedera.com

# ── Publication ──────────────────────────────────────────────────────────────
# Most recent mainnet IPFS timestamp — convenience pointer for one-click import.
# Full publication history (all networks and versions) lives in publications.json.
# To append a new entry after publishing in Guardian, run:
#   node scripts/record-publication.js --policy verra-vm0007-redd-plus \
#     --network mainnet --version 3.0.0 --ipfs-timestamp <timestamp>

ipfs_timestamp: "1707207286.119377003"

# ── Alignment ────────────────────────────────────────────────────────────────

# UN Sustainable Development Goal numbers (1–17) this policy contributes to.
sdg_alignment:
  - 13   # Climate Action
  - 15   # Life on Land

# Primary economic sector of the project activity.
# energy | transport | waste | land-use | industrial | agriculture | water | other
sector: land-use

# ── Workflow roles ───────────────────────────────────────────────────────────

roles:
  - Standard Registry
  - Project Proponent
  - Validation and Verification Body (VVB)
  - Verra

# ── Lineage ──────────────────────────────────────────────────────────────────

# ID of the policy this manifest supersedes (null = first in the line).
supersedes: ~

