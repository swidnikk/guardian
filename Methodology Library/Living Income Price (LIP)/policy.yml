# Guardian Policy Manifest — Living Income Price (LIP) Policy
# Schema: https://guardian.hedera.com/schemas/policy-manifest/v1.0.0/policy.schema.json
# Spec:   ../MANIFEST_SPEC.md

# ── Identity ────────────────────────────────────────────────────────────────

# Globally unique kebab-case slug.
id: living-income-price

# Human-readable display name.
name: "Living Income Price (LIP) Policy"

# Semver of this Guardian implementation.
version: "1.0.0"

# 1–3 sentence plain-English summary.
description: >
  Digitises the Living Income Price (LIP) framework — developed by Fairfood
  and Heifer International — inside the Hedera Guardian platform. The policy
  calculates and immutably proves the minimum farm-gate, cooperative, and FOB
  price a smallholder farmer must receive to reach a living income, by
  collecting yield, cost, and benchmark data from field enumerators, cooperatives,
  and exporters through a multi-role verifiable-credential workflow. When all
  submissions are verified, Guardian mints a Living Income Token (LIT) — a
  HIP-412 NFT whose metadata stores the price floors, Cost-Yield-Efficiency
  class, dataset hashes, and multi-signature approvals.

# ── Classification ───────────────────────────────────────────────────────────

# novel-methodology: the Guardian implementation follows the Fairfood/Heifer
# LIP framework, which is not yet a formally codified standard methodology
# recognized by a single certifying body.
policy_type: novel-methodology

# Implementation lifecycle state.
status: active

license: Apache-2.0

# payments — the primary output is a verified living-income price floor
# used to determine fair farmer payments.
category: payments

# ── Upstream methodology ─────────────────────────────────────────────────────

# The LIP methodology is a Fairfood + Heifer International framework.
# No single formal standards body owns it; standard_body is omitted.
# See the Commodity Living Income Strategy White Paper (Sept 2024).

# ── Token ────────────────────────────────────────────────────────────────────

# Living Income Token — one NFT per validated price-floor determination.
token_type: LIT

# Hedera token standard: fungible | HIP-412-NFT | none
token_standard: HIP-412-NFT

# ── Registry ─────────────────────────────────────────────────────────────────

# No external registry validates living-income price-floor certifications
# in the carbon/environmental registry sense.
registry_status: none

