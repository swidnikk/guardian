id: hackathon-agrify-regenerative-agriculture-methodology
name: Agrify Regenerative Agriculture Methodology
version: "1.0.0"
description: >
  Hackathon proof-of-concept for issuing carbon credits from regenerative
  agriculture projects. Project proponents submit farm projects, a VVB
  reviews them, and a VCU non-fungible token is minted on approval.
