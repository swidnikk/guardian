# Guardian Policy Manifest — EUDR Pre-Check Policy
# Schema: https://guardian.hedera.com/schemas/policy-manifest/v1.0.0/policy.schema.json
# Spec:   ../MANIFEST_SPEC.md

# ── Identity ────────────────────────────────────────────────────────────────

# Globally unique kebab-case slug.
id: eudr-precheck

# Human-readable display name.
name: "EUDR Pre-Check Policy"

# Semver of this Guardian implementation.
version: "1.0.0"

# 1–3 sentence plain-English summary.
description: >
  A multi-party Guardian workflow that enables suppliers to prove — before
  shipment — that their farmer polygons are geometrically valid and have been
  benchmarked against public deforestation-risk datasets including Global Forest
  Watch and the World Database on Protected Areas. Independent analysts and a
  standards regulator each provide cryptographic attestations; when all parties
  agree, Guardian mints an EUDR Pre-Check Token (EUDRT) — a HIP-412 NFT whose
  metadata locks in the polygon hash, validation results, and regulator signature.

# ── Classification ───────────────────────────────────────────────────────────

# novel-methodology: policy originated within Guardian for a use case not yet
# covered by a single established external standard.
policy_type: novel-methodology

# Implementation lifecycle state.
status: active

license: Apache-2.0

# supply-chain — the policy certifies deforestation-risk status of supply-chain polygons.
category: supply-chain

# ── Upstream methodology ─────────────────────────────────────────────────────

# No external standards body owns this methodology — it is self-developed
# against the EU Deforestation Regulation (EUDR) requirements.
# Omitting standard_body, methodology_id, methodology_version.

# ── Token ────────────────────────────────────────────────────────────────────

# EUDR Pre-Check Token — one NFT per validated polygon / supply-chain claim.
token_type: EUDRT

# Hedera token standard: fungible | HIP-412-NFT | none
token_standard: HIP-412-NFT

# ── Registry ─────────────────────────────────────────────────────────────────

# No external registry validates this policy type.
# none | pending | validated | revoked
registry_status: none

