id: other-improved-cookstove
name: Improved CookStove
version: "2.6.1"
description: >
  Guardian policy suite for improved biomass cookstove projects: a main policy
  that issues non-fungible Improved Cookstove carbon credit tokens, with
  subpolicies for agent licensing, PDD validation and monitoring report
  verification. Abstracts common standards rather than adhering to one.
policy_type: novel-methodology
status: draft
