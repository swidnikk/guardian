id: wip-deloitte-esi-mangrove
name: Deloitte ESI Mangrove
version: "1.0.0"
description: >
  Deloitte ESI dMRV workflow for mangrove restoration: field operators log sediment
  cores and samples, lab operators enter lab results, and Guardian calculates dry bulk
  density and organic carbon content, chaining the data as one VC per sample for dashboard viewing.
